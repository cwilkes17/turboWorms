<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>turboWorms</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      color: #9fb4c9;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    canvas#c {
      display: block;
      width: 100vw;
      height: calc(100vh - 52px);
    }
    #hud {
      box-sizing: border-box;
      height: 52px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.35;
      border-top: 1px solid #1f2a38;
      background: rgba(10, 14, 20, 0.92);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    #hud-help {
      flex: 1 1 auto;
      min-width: 0;
    }
    #hud-stats {
      flex: 0 0 auto;
      display: flex;
      gap: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #hud-score { color: #c8e0ff; }
    #hud-mass { color: #a8e6a1; }
    #hud-drain {
      color: #9fb4c9;
      /* Reserves room for the widest realistic value ("DRAIN: -999.9/s") so toggling
         between "0/s" and an active rate doesn't change this element's width and shift
         SCORE/MASS to the left (this span is a flex item, so min-width applies directly). */
      display: inline-block;
      min-width: 16ch;
    }
    #hud-drain.active { color: #ff9d7a; }
    code { color: #c8e0ff; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540" aria-label="Game view"></canvas>
  <div id="hud">
    <div id="hud-help">
      Wasd / arrows: move · <code>Space</code> fire · <code>Q</code> shield · hold <code>Shift</code> boost · <code>E</code> turbo.
      Websocket · add <code>?ws=ws://host:port</code> when not served from game server (e.g. file://).
    </div>
    <div id="hud-stats">
      <span id="hud-score">SCORE: 0</span>
      <span id="hud-mass">MASS: 0</span>
      <span id="hud-drain">DRAIN: 0/s</span>
    </div>
  </div>
  <script src="/client.bundle.js"></script>
</body>
</html>
